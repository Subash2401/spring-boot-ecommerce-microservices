<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- See login.html for what the Content-Security-Policy does. -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; connect-src http://localhost:8080; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
	<title>Register - Microshop</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
		integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
	<link rel="stylesheet" href="css/app.css">
</head>
<body>
	<nav id="navbar" class="navbar navbar-expand-md navbar-dark bg-dark"></nav>

	<main class="container py-5">
		<div class="auth-box mx-auto card shadow-sm">
			<div class="card-body p-4">
				<h1 class="h4 mb-4">Create an account</h1>
				<div id="message"></div>
				<!-- The limits match the backend's RegisterRequest validation -->
				<form id="register-form" novalidate>
					<div class="mb-3">
						<label for="name" class="form-label">Name</label>
						<input type="text" id="name" class="form-control" required maxlength="100" autocomplete="name">
					</div>
					<div class="mb-3">
						<label for="email" class="form-label">Email</label>
						<input type="email" id="email" class="form-control" required maxlength="254" autocomplete="email">
					</div>
					<div class="mb-3">
						<label for="password" class="form-label">Password</label>
						<input type="password" id="password" class="form-control" required minlength="8" maxlength="72" autocomplete="new-password">
						<div class="form-text">8 to 72 characters.</div>
					</div>
					<button type="submit" id="submit" class="btn btn-primary w-100">Register</button>
				</form>
				<p class="mt-3 mb-0 text-center">Already registered? <a href="login.html">Log in</a></p>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
	<script type="module" src="js/pages/register.js"></script>
</body>
</html>
