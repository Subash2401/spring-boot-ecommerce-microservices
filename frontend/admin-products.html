<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- See login.html for what the Content-Security-Policy does. -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; connect-src http://localhost:8080; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
	<title>Admin: products - Microshop</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
		integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
	<link rel="stylesheet" href="css/app.css">
</head>
<body>
	<nav id="navbar" class="navbar navbar-expand-md navbar-dark bg-dark"></nav>

	<main class="container py-4">
		<h1 class="h3 mb-4">Admin: products</h1>
		<div id="message"></div>

		<div id="admin-area" class="d-none">
			<!-- One form for both "new product" and "edit product". The limits match the backend's ProductRequest. -->
			<div class="card shadow-sm mb-4">
				<div class="card-body">
					<h2 class="h5 mb-3" id="form-title">New product</h2>
					<form id="product-form" novalidate>
						<div class="row g-3">
							<div class="col-md-6">
								<label for="name" class="form-label">Name</label>
								<input type="text" id="name" class="form-control" required maxlength="100">
							</div>
							<div class="col-6 col-md-3">
								<label for="price" class="form-label">Price (₹)</label>
								<input type="number" id="price" class="form-control" required min="0.01" step="0.01">
							</div>
							<div class="col-6 col-md-3">
								<label for="quantity" class="form-label">Stock</label>
								<input type="number" id="quantity" class="form-control" required min="0" step="1">
							</div>
							<div class="col-12">
								<label for="description" class="form-label">Description</label>
								<textarea id="description" class="form-control" rows="2" maxlength="1000"></textarea>
							</div>
						</div>
						<div class="d-flex gap-2 mt-3">
							<button type="submit" id="save" class="btn btn-primary">Create product</button>
							<button type="button" id="cancel-edit" class="btn btn-outline-secondary d-none">Cancel editing</button>
						</div>
					</form>
				</div>
			</div>

			<div id="products"></div>
			<div id="pager"></div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
	<script type="module" src="js/pages/admin-products.js"></script>
</body>
</html>
