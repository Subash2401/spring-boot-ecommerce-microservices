<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- Content-Security-Policy: the browser only runs scripts from our own files and the
	     Bootstrap CDN, and only talks to our API. Inline scripts are blocked (XSS protection). -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; connect-src http://localhost:8080; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
	<title>Log in - Microshop</title>
	<!-- Bootstrap 5.3.9, pinned. "integrity" makes the browser refuse the file if the CDN ever changes it. -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
		integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
	<link rel="stylesheet" href="css/app.css">
</head>
<body>
	<nav id="navbar" class="navbar navbar-expand-md navbar-dark bg-dark"></nav>

	<main class="container py-5">
		<div class="auth-box mx-auto card shadow-sm">
			<div class="card-body p-4">
				<h1 class="h4 mb-4">Log in</h1>
				<div id="message"></div>
				<form id="login-form" novalidate>
					<div class="mb-3">
						<label for="email" class="form-label">Email</label>
						<input type="email" id="email" class="form-control" required maxlength="254" autocomplete="email">
					</div>
					<div class="mb-3">
						<label for="password" class="form-label">Password</label>
						<input type="password" id="password" class="form-control" required maxlength="72" autocomplete="current-password">
					</div>
					<button type="submit" id="submit" class="btn btn-primary w-100">Log in</button>
				</form>
				<p class="mt-3 mb-0 text-center">No account yet? <a href="register.html">Register</a></p>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
	<script type="module" src="js/pages/login.js"></script>
</body>
</html>
