# What both server blocks (HTTP-only and HTTPS) serve: the frontend and the API.
# Included from http.conf.template and https.conf.template.

root /usr/share/nginx/html;
index index.html;

# Same limit as the gateway's RequestSize filter
client_max_body_size 1m;

# Docker's internal DNS. With a variable in proxy_pass, nginx looks the gateway up again
# every 10 s, so a restarted gateway container (new IP address) is found without a reload.
resolver 127.0.0.11 valid=10s;

# ---- The API: same origin as the pages, forwarded to the API gateway ---------------------
# The gateway itself is not public; only nginx can reach it inside the Docker network.
location ~ ^/(users|products|orders|payments|notifications)(/|$) {
    set $gateway http://api-gateway:8080;
    proxy_pass $gateway;

    proxy_set_header Host              $host;
    # $remote_addr, not $proxy_add_x_forwarded_for: OVERWRITE whatever X-Forwarded-For the
    # client sent. The gateway rate-limits per client IP from this header, so a client must
    # not be able to choose its own IP. (Behind a cloud load balancer, see docs/DEPLOY.md.)
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
}

# ---- The frontend (static files) ---------------------------------------------------------
location / {
    try_files $uri $uri/ =404;
    # No build step means no hashed file names: let the browser re-check every file
    # (cheap, it gets 304 Not Modified when nothing changed), so a deploy is seen at once.
    expires -1;
}

gzip on;
gzip_types text/css application/javascript application/json;
