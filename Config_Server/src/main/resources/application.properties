spring.application.name=config-server

server.port=8888
# The Git repo with one <app-name>.properties per service, and its login (all from .env;
# the token is a read-only access token of that Git host)
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI}
spring.cloud.config.server.git.default-label=main
# Optional sub-folder of that repo that holds the files (empty = the repo root). The public
# repo uses config-repo-example: CONFIG_GIT_URI=<public repo>.git, CONFIG_GIT_SEARCH_PATHS=config-repo-example
spring.cloud.config.server.git.search-paths=${CONFIG_GIT_SEARCH_PATHS:}
spring.cloud.config.server.git.username=${CONFIG_GIT_USERNAME:}
spring.cloud.config.server.git.password=${GITLAB_TOKEN}

# HTTP Basic login that the config clients must send (values come from .env)
spring.security.user.name=${CONFIG_USERNAME}
spring.security.user.password=${CONFIG_PASSWORD}
