#Server
server.port=8080

#Gateway routes (WebFlux)
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/products/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/orders/**

spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/payments/**

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/notifications/**

#Request size limit
spring.cloud.gateway.server.webflux.default-filters[0].name=RequestSize
spring.cloud.gateway.server.webflux.default-filters[0].args.maxSize=1MB

#Rate limit: every route, 20/sec per IP, burst 40
spring.cloud.gateway.server.webflux.default-filters[1].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.default-filters[1].args[redis-rate-limiter.replenishRate]=20
spring.cloud.gateway.server.webflux.default-filters[1].args[redis-rate-limiter.burstCapacity]=40
spring.cloud.gateway.server.webflux.default-filters[1].args[redis-rate-limiter.requestedTokens]=1
spring.cloud.gateway.server.webflux.default-filters[1].args[key-resolver]=#{@ipKeyResolver}

#Rate limit: login and register, 5 per minute per IP
spring.cloud.gateway.server.webflux.routes[5].id=user-auth
spring.cloud.gateway.server.webflux.routes[5].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[5].order=-1
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/users/login,/users/register,/users/refresh
spring.cloud.gateway.server.webflux.routes[5].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[5].filters[0].args[redis-rate-limiter.replenishRate]=1
spring.cloud.gateway.server.webflux.routes[5].filters[0].args[redis-rate-limiter.burstCapacity]=60
spring.cloud.gateway.server.webflux.routes[5].filters[0].args[redis-rate-limiter.requestedTokens]=12
spring.cloud.gateway.server.webflux.routes[5].filters[0].args[key-resolver]=#{@authKeyResolver}

#CORS (frontend on Live Server)
app.cors.allowed-origins=http://localhost:5501

# Swagger UI (http://localhost:8080/swagger-ui.html): one entry per service in the dropdown
springdoc.swagger-ui.urls[0].name=user-service
springdoc.swagger-ui.urls[0].url=/api-docs/user-service
springdoc.swagger-ui.urls[1].name=product-service
springdoc.swagger-ui.urls[1].url=/api-docs/product-service
springdoc.swagger-ui.urls[2].name=order-service
springdoc.swagger-ui.urls[2].url=/api-docs/order-service
springdoc.swagger-ui.urls[3].name=payment-service
springdoc.swagger-ui.urls[3].url=/api-docs/payment-service
springdoc.swagger-ui.urls[4].name=notification-service
springdoc.swagger-ui.urls[4].url=/api-docs/notification-service
springdoc.swagger-ui.urls-primary-name=user-service
springdoc.swagger-ui.persist-authorization=true
