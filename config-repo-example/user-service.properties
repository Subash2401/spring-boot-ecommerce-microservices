#Server
server.port=8082

#MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/userdb?createDatabaseIfNotExist=true
spring.datasource.username=user_svc
spring.datasource.password=${USER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

#Scheduler threads (outbox, refresh-token cleanup, outbox cleanup)
spring.task.scheduling.pool.size=4

#Kafka
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.bootstrap-servers=localhost:9092

#Jwt
jwt.expiration=1800000
