#Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

#Kafka topics
kafka.topic.order-events=order-events
kafka.topic.payment-events=payment-events
kafka.topic.inventory-events=inventory-events
kafka.topic.user-events=user-events

#Jwt
jwt.secret=${JWT_SECRET}

#Actuator
management.endpoints.web.exposure.include=health,info

spring.lifecycle.timeout-per-shutdown-phase=25s
